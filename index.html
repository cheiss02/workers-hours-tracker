// ── SHEETS HELPERS ────────────────────────────────────────────────────────────
let gapiReady = false;
let tokenClient = null;
let accessToken = null;

async function sheetsGet(range){
  const url=`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(range)}?key=${API_KEY}`;
  const r=await fetch(url,{headers:accessToken?{Authorization:"Bearer "+accessToken}:{}});
  const d=await r.json();
  return d.values||[];
}

async function sheetsAppend(sheetName, row){
  const url=`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(sheetName+"!A1")}:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS&key=${API_KEY}`;
  await fetch(url,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+accessToken},body:JSON.stringify({values:[row]})});
}

async function sheetsUpdate(range, values){
  const url=`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(range)}?valueInputOption=RAW&key=${API_KEY}`;
  await fetch(url,{method:"PUT",headers:{"Content-Type":"application/json",Authorization:"Bearer "+accessToken},body:JSON.stringify({values})});
}

async function sheetsFindRow(sheetName, colIndex, value){
  const rows = await sheetsGet(sheetName+"!A:Z");
  const idx = rows.findIndex((r,i)=>i>0&&r[colIndex]===String(value));
  return idx; // 0-based index in rows array, -1 if not found
}

// Parse sheet rows (skip header row 0)
function parseRows(rows, keys){
  if(rows.length<2) return [];
  return rows.slice(1).map(r=>Object.fromEntries(keys.map((k,i)=>[k,r[i]||""])));
}

// ── DATA LOAD ─────────────────────────────────────────────────────────────────
async function loadAll(){
  const [pRows,eRows,lRows,uRows,upRows] = await Promise.all([
    sheetsGet("Projects!A:E"),
    sheetsGet("Employees!A:C"),
    sheetsGet("Logs!A:G"),
    sheetsGet("Users!A:D"),
    sheetsGet("Updates!A:H"),
  ]);
  return {
    projects: parseRows(pRows,["id","name","color","location","closed"]).map(p=>({...p,closed:String(p.closed).toLowerCase()==="true"})),
    employees: parseRows(eRows,["id","name","rate"]).map(e=>({...e,rate:parseFloat(e.rate)||0,id:parseInt(e.id)})),
    logs: parseRows(lRows,["id","employeeId","projectId","date","hours","location"]).map(l=>({...l,employeeId:parseInt(l.employeeId),projectId:parseInt(l.projectId),hours:parseFloat(l.hours)||0,id:parseInt(l.id)})),
    users: parseRows(uRows,["id","name","email","role"]),
    updates: parseRows(upRows,["id","projectId","type","date","note","amount","photo","author"]).map(u=>({...u,projectId:parseInt(u.projectId),amount:parseFloat(u.amount)||0,id:parseInt(u.id)})),
  };
}

function Toast({msg}){

  const byEmp=employees.map(emp=>{const h=pLogs.filter(l=>l.employeeId===emp.id).reduce((s,l)=>s+l.hours,0);return{...emp,hours:h,salary:emp.rate*h};}).filter(x=>x.hours>0);
  const totalSalary=byEmp.reduce((s,x)=>s+x.salary,0);
  const totalSpend=spends.reduce((s,u)=>s+(u.amount||0),0);

    e(SL,{t:"💰 Salary Paid"}),
    e("div",{style:{background:"#F9F7F5",borderRadius:12,overflow:"hidden",marginBottom:16}},
      byEmp.length===0?e("p",{style:{margin:0,padding:"12px",fontSize:12,color:"#AAA",textAlign:"center"}},"No hours logged yet"):
      e(React.Fragment,null,
        byEmp.map((emp,i)=>e("div",{key:emp.id,style:{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderBottom:i<byEmp.length-1?"1px solid #F0EDE9":"none"}},
          e(Avatar,{name:emp.name,size:28}),
          e("div",{style:{flex:1}},e("p",{style:{margin:0,fontSize:13,fontWeight:600}},emp.name),e("p",{style:{margin:0,fontSize:11,color:"#AAA"}},`${emp.hours}h × $${emp.rate}/hr`)),
          e("p",{style:{margin:0,fontWeight:700,fontSize:14}},"$"+fmt(emp.salary))
        )),
        e("div",{style:{display:"flex",justifyContent:"space-between",padding:"10px 12px",background:"#1A1A1A",borderRadius:"0 0 12px 12px"}},
          e("p",{style:{margin:0,fontSize:12,fontWeight:700,color:"#fff"}},"Total Salary"),
          e("p",{style:{margin:0,fontSize:14,fontWeight:800,color:"#D97941"}},"$"+fmt(totalSalary))

      spends.length===0?e("p",{style:{margin:0,padding:"12px",fontSize:12,color:"#AAA",textAlign:"center"}},"No expenses logged yet"):
      e(React.Fragment,null,
        spends.map((u,i)=>e("div",{key:u.id,style:{padding:"10px 12px",borderBottom:i<spends.length-1?"1px solid #F0EDE9":"none"}},
          e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}},
            e("div",{style:{flex:1}},e("p",{style:{margin:0,fontSize:13,fontWeight:600}},u.note),e("p",{style:{margin:"2px 0 0",fontSize:11,color:"#AAA"}},fmtDate(u.date)+" · "+u.author)),
            e("p",{style:{margin:0,fontWeight:700,fontSize:14,color:"#4A9E6B",marginLeft:8}},"$"+fmt(u.amount))
          ),
          u.photo&&u.photo.startsWith("http")&&e("img",{src:u.photo,style:{width:"100%",borderRadius:8,marginTop:8,maxHeight:120,objectFit:"cover"}})
        )),
        e("div",{style:{display:"flex",justifyContent:"space-between",padding:"10px 12px",background:"#1A1A1A",borderRadius:"0 0 12px 12px"}},
          e("p",{style:{margin:0,fontSize:12,fontWeight:700,color:"#fff"}},"Total Expenses"),
          e("p",{style:{margin:0,fontSize:14,fontWeight:800,color:"#4A9E6B"}},"$"+fmt(totalSpend))

    e("div",{style:{position:"relative"}},
      e("div",{style:{position:"absolute",left:15,top:0,bottom:0,width:2,background:"#E8E4DF",borderRadius:2}}),

// ── MAIN APP ─────────────────────────────────────────────────────────────────
function App(){
  const [screen,setScreen]=useState("login"); // login | authorize | loading | app
  const [currentUser,setCurrentUser]=useState(null);
  const [pendingAuth,setPendingAuth]=useState(null);
  const pendingAuthRef=useRef(null);
  const tokenTimeoutRef=useRef(null);
  const [data,setData]=useState({projects:[],employees:[],logs:[],users:[],updates:[]});
  const [saving,setSaving]=useState(false);
  const [toast,setToast]=useState("");
  const [tab,setTab]=useState("Projects");
  const [pFilter,setPFilter]=useState("active");
  const [expanded,setExpanded]=useState({});
  const [modal,setModal]=useState(null);
  const [confirmId,setConfirmId]=useState(null);
  const [selProjId,setSelProjId]=useState(null);
  const [form,setForm]=useState({});
  const [photoPreview,setPhotoPreview]=useState("");
  const photoRef=useRef();

  const showToast=(msg)=>{setToast(msg);setTimeout(()=>setToast(""),2500);};
  const closeModal=()=>{setModal(null);setForm({});setPhotoPreview("");if(photoRef.current)photoRef.current.value="";};
  const sf=(k,v)=>setForm(f=>({...f,[k]:v}));
  const loadPhotoFile=file=>{
    if(!file)return;
    const reader=new FileReader();
    reader.onload=()=>{sf("photo",reader.result);setPhotoPreview(reader.result);};
    reader.readAsDataURL(file);
  };
  const clearPhoto=()=>{sf("photo","");setPhotoPreview("");if(photoRef.current)photoRef.current.value="";};
  const activePr=data.projects.filter(p=>!p.closed);
  const filteredPr=pFilter==="active"?activePr:data.projects.filter(p=>p.closed);

  // ── GOOGLE SIGN-IN
  useEffect(()=>{
    window.handleCredentialResponse=async(response)=>{
      const payload=JSON.parse(atob(response.credential.split(".")[1]));
      const email=payload.email;
      const name=payload.name;
      pendingAuthRef.current={email,name};
      setPendingAuth({email,name});
      setScreen("authorize");

      tokenClient=google.accounts.oauth2.initTokenClient({
        client_id:CLIENT_ID,
        scope:SCOPES,
        ux_mode: 'popup',
        login_hint: email,
        callback: async(tokenResponse)=>{
          console.log('tokenResponse', tokenResponse);
          if(tokenTimeoutRef.current){
            clearTimeout(tokenTimeoutRef.current);
            tokenTimeoutRef.current = null;
          }
          if(tokenResponse.error){
            console.error("Token error", tokenResponse);
            alert("Unable to authorize Sheets access. Please try again.");
            setScreen("login");
            pendingAuthRef.current=null;
            setPendingAuth(null);
            return;
          }
          accessToken=tokenResponse.access_token;
          try{
            const loaded=await loadAll();
            const found=loaded.users.find(u=>u.email.toLowerCase()===pendingAuthRef.current?.email.toLowerCase());
            if(!found){
              alert("Access denied. Ask the project owner to add your email.");
              setScreen("login");
              pendingAuthRef.current=null;
              setPendingAuth(null);
              return;
            }
            setCurrentUser({...found,name:found.name||pendingAuthRef.current?.name});
            setData(loaded);
            setScreen("app");
            pendingAuthRef.current=null;
            setPendingAuth(null);
          }catch(err){
            console.error(err);
            alert("Error loading data. Check your Sheet is set up and API access is configured.");
            setScreen("login");
            pendingAuthRef.current=null;
            setPendingAuth(null);
          }
        }
      });
    };

    const renderGoogleButton = () => {
      if(window.google?.accounts?.id){
        google.accounts.id.initialize({
          client_id: CLIENT_ID,
          callback: window.handleCredentialResponse,
          auto_select: false,
          cancel_on_tap_outside: false,
        });
        const container = document.querySelector('.g_id_signin');
        if(container){
          google.accounts.id.renderButton(container, {
            type: 'standard',
            theme: 'outline',
            size: 'large',
            text: 'sign_in_with',
            shape: 'pill',
            width: 300,
          });
        }
        return true;
      }
      return false;
    };

    const interval = setInterval(() => {
      if(renderGoogleButton()){
        clearInterval(interval);
      }
    }, 150);

    return ()=>clearInterval(interval);
  },[]);

  async function requestAccess(){
    if(!pendingAuthRef.current) return;
    if(!tokenClient){
      alert("Authorization is not ready yet. Please try signing in again.");
      setScreen("login");
      return;
    }
    setScreen("loading");
    tokenTimeoutRef.current = setTimeout(()=>{
      alert("Authorization timed out. Please allow popups and try again.");
      setScreen("authorize");
    },10000);
    try{
      tokenClient.requestAccessToken({prompt:"consent"});
    }catch(err){
      if(tokenTimeoutRef.current){
        clearTimeout(tokenTimeoutRef.current);
        tokenTimeoutRef.current=null;
      }
      console.error(err);
      alert("Authorization could not start. Please allow popups and try again.");
      setScreen("authorize");
    }
  }

  // ── REFRESH DATA
  const refresh=async()=>{
    const loaded=await loadAll();
    setData(loaded);
  };

  // ── ACTIONS
  async function addProject(){
    if(!form.name?.trim())return;
    setSaving(true);
    if(form.id){
      const rows=await sheetsGet("Projects!A:E");
      const rowIdx=rows.findIndex((r,i)=>i>0&&r[0]===String(form.id));
      if(rowIdx>0){
        await sheetsUpdate(`Projects!A${rowIdx+1}:D${rowIdx+1}`,[[''+form.id,form.name.trim(),form.color||rows[rowIdx][2]||COLORS[rowIdx%COLORS.length],form.location||""]]);
      }
      showToast("Project updated ✓");
    } else {
      const id=uid();
      const color=COLORS[data.projects.length%COLORS.length];
      await sheetsAppend("Projects",[id,form.name.trim(),color,form.location||"",false]);
      showToast("Project added ✓");
    }
    await refresh();
    setSaving(false);closeModal();
  }

  async function addEmployee(){
    if(!form.name?.trim())return;
    setSaving(true);
    if(form.id){
      const rows=await sheetsGet("Employees!A:C");
      const rowIdx=rows.findIndex((r,i)=>i>0&&r[0]===String(form.id));
      if(rowIdx>0){
        await sheetsUpdate(`Employees!A${rowIdx+1}:C${rowIdx+1}`,[[''+form.id,form.name.trim(),parseFloat(form.rate)||0]]);
      }
      showToast("Employee updated ✓");
    } else {
      await sheetsAppend("Employees",[uid(),form.name.trim(),parseFloat(form.rate)||0]);
      showToast("Employee added ✓");
    }
    await refresh();
    setSaving(false);closeModal();
  }

  async function logHours(){
    if(!form.eId||!form.pId||!form.date)return;
    setSaving(true);
    await sheetsAppend("Logs",[uid(),parseInt(form.eId),parseInt(form.pId),form.date,parseFloat(form.hours)||0,form.location||""]);
    await refresh();
    setSaving(false);showToast("Hours logged ✓");closeModal();
  }

  async function addEntry(){
    const isSpend=form.utype==="spend";
    if(!form.note?.trim()&&!form.photo)return;
    if(!form.pId)return;
    setSaving(true);
    if(form.id){
      const rows=await sheetsGet("Updates!A:H");
      const rowIdx=rows.findIndex((r,i)=>i>0&&r[0]===String(form.id));
      if(rowIdx>0){
        await sheetsUpdate(`Updates!A${rowIdx+1}:H${rowIdx+1}`,[[''+form.id,parseInt(form.pId),isSpend?"spend":"update",form.date||today(),form.note||"",isSpend?parseFloat(form.amount)||0:"",form.photo||"",currentUser.name]]);
      }
      showToast("Entry updated ✓");
    } else {
      await sheetsAppend("Updates",[uid(),parseInt(form.pId),isSpend?"spend":"update",form.date||today(),form.note||"",isSpend?parseFloat(form.amount)||0:"",form.photo||"",currentUser.name]);
      showToast("Entry saved ✓");
    }
    await refresh();
    setSaving(false);closeModal();
  }

  async function closeProject(id){
    setSaving(true);
    const rows=await sheetsGet("Projects!A:E");
    const rowIdx=rows.findIndex((r,i)=>i>0&&r[0]===String(id));
    if(rowIdx>0){
      await sheetsUpdate(`Projects!E${rowIdx+1}`,[[true]]);
    }
    await refresh();
    setSaving(false);setConfirmId(null);showToast("Project closed ✓");
  }

  async function reopenProject(id){
    setSaving(true);
    const rows=await sheetsGet("Projects!A:E");
    const rowIdx=rows.findIndex((r,i)=>i>0&&r[0]===String(id));
    if(rowIdx>0){
      await sheetsUpdate(`Projects!E${rowIdx+1}`,[[false]]);
    }
    await refresh();
    setSaving(false);showToast("Project reopened ✓");
  }

  async function addUser(){
    if(!form.name?.trim()||!form.email?.trim())return;
    setSaving(true);
    await sheetsAppend("Users",[uid(),form.name.trim(),form.email.trim(),form.role||"Manager"]);
    await refresh();
    setSaving(false);showToast("User added ✓");closeModal();
  }

  async function removeUser(id){
    // Mark as removed by clearing row (simple approach)
    setSaving(true);
    const rows=await sheetsGet("Users!A:D");
    const rowIdx=rows.findIndex((r,i)=>i>0&&r[0]===String(id));
    if(rowIdx>0){
      await sheetsUpdate(`Users!A${rowIdx+1}:D${rowIdx+1}`,[['','','','removed']]);
    }
    await refresh();
    setSaving(false);showToast("User removed ✓");
  }

  async function deleteProject(id){

  function arrayBufferToBase64(buffer){
    let binary = "";
    const bytes = new Uint8Array(buffer);
    const chunkSize = 0x8000;
    for(let i=0;i<bytes.length;i+=chunkSize){
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunkSize));
    }
    return window.btoa(binary);
  }

  function base64UrlEncode(str){
    return window.btoa(str).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/g,"");
  }

  async function sendWeeklyReportEmail(){

    e(Modal,{show:modal==="addEntry",onClose:closeModal,title:form.id?"Edit Entry":"Add Entry"},
      e("div",{style:{display:"flex",background:"#F0EDE9",borderRadius:14,padding:4,marginBottom:16}},
        [["update","📋 Site Update"],["spend","🧾 Log Spend"]].map(([val,lbl])=>
          e("button",{key:val,onClick:()=>sf("utype",val),style:{flex:1,padding:"9px",border:"none",borderRadius:11,background:form.utype===val?"#1A1A1A":"transparent",color:form.utype===val?"#fff":"#888",fontWeight:700,fontSize:13}},lbl)
        )
      ),
      e(Field,{label:"Project"},e(Sel,{value:form.pId||"",onChange:ev=>sf("pId",ev.target.value)},e("option",{value:""},"Select project…"),data.projects.map(x=>e("option",{key:x.id,value:x.id},x.name+(x.closed?" (closed)":""))))),
      e(Field,{label:"Date"},e(Inp,{type:"date",value:form.date||today(),onChange:ev=>sf("date",ev.target.value)})),
      form.utype==="spend"&&e(Field,{label:"Amount ($)"},e(Inp,{type:"number",placeholder:"0.00",value:form.amount||"",onChange:ev=>sf("amount",ev.target.value)})),
      e(Field,{label:"Photo"},
        e("div",{style:{display:"grid",gap:10}},
          e("input",{ref:photoRef,type:"file",accept:"image/*",capture:"environment",onChange:ev=>loadPhotoFile(ev.target.files[0]),style:{width:"100%"}}),
          e("p",{style:{margin:0,fontSize:12,color:"#888"}},"Or paste an image URL below"),
          e(Inp,{type:"url",placeholder:"https://...",value:form.photo||"",onChange:ev=>{sf("photo",ev.target.value);setPhotoPreview(ev.target.value||"");}})
        )
      ),
      photoPreview&&e("img",{src:photoPreview,style:{width:"100%",borderRadius:12,marginTop:8,maxHeight:180,objectFit:"cover"}}),
      photoPreview&&e("button",{type:"button",onClick:clearPhoto,style:{border:"none",background:"transparent",color:"#D97941",fontSize:12,fontWeight:700,marginTop:8,cursor:"pointer"}},"Remove photo"),
      e(Field,{label:form.utype==="spend"?"Description":"Note / Update"},
        e("textarea",{placeholder:form.utype==="spend"?"e.g. Lumber delivery…":"Site update, observations…",value:form.note||"",onChange:ev=>sf("note",ev.target.value),style:{width:"100%",padding:"12px 14px",borderRadius:12,border:"1.5px solid #E8E4DF",fontSize:14,boxSizing:"border-box",outline:"none",minHeight:80,resize:"vertical"}})
      ),
      e(Btn,{onClick:addEntry,disabled:saving||(!form.note?.trim()&&!form.photo)},saving?"Saving…":form.id?"Update Entry":"Save Entry")
    ),

    e(Modal,{show:modal==="exportPDF",onClose:closeModal,title:"Export Report"},
      e(Field,{label:"Project"},e(Sel,{value:selProjId||"",onChange:ev=>setSelProjId(parseInt(ev.target.value))},e("option",{value:""},"Select…"),data.projects.map(p=>e("option",{key:p.id,value:p.id},p.name)))),
      e("div",{style:{display:"flex",gap:10}},
        e(Field,{label:"From"},e(Inp,{type:"date",value:form.startDate||"",onChange:ev=>sf("startDate",ev.target.value)})),
        e(Field,{label:"To"},e(Inp,{type:"date",value:form.endDate||"",onChange:ev=>sf("endDate",ev.target.value)}))
      ),
      e("div",{style:{display:"flex",alignItems:"center",gap:10,background:"#F5F2EE",borderRadius:12,padding:"12px 14px",marginBottom:16}},
        e("input",{type:"checkbox",id:"inc",checked:form.includeSpend??true,onChange:ev=>sf("includeSpend",ev.target.checked),style:{width:18,height:18}}),
        e("label",{htmlFor:"inc",style:{fontSize:14,fontWeight:600}},"Include salary & expense summary")
      ),
      e(Btn,{variant:"dark",disabled:!form.startDate||!form.endDate||!selProjId,onClick:exportPDF},"📄 Download Report"),
      e("p",{style:{textAlign:"center",fontSize:11,color:"#aaa",marginTop:10}},"Open in browser → Print → Save as PDF")
    ),

    e(Modal,{show:modal==="weeklyReport",onClose:closeModal,title:"Weekly Report"},
      e(Field,{label:"From"},e(Inp,{type:"date",value:form.startDate||today(),onChange:ev=>sf("startDate",ev.target.value)})),
      e(Field,{label:"To"},e(Inp,{type:"date",value:form.endDate||today(),onChange:ev=>sf("endDate",ev.target.value)})),
      e(Field,{label:"Recipient Email"},e(Inp,{type:"email",placeholder:"email@example.com",value:form.email||"",onChange:ev=>sf("email",ev.target.value)})),
      e("p",{style:{fontSize:12,color:"#888",marginBottom:16}},"Report shows hours per employee, per project, and total hours in the selected period."),
      e(Btn,{variant:"dark",disabled:!form.startDate||!form.endDate,onClick:exportWeeklyReport},"📄 Download Weekly Report"),
      e(Btn,{variant:"orange",disabled:!form.startDate||!form.endDate||!form.email||saving,style:{marginTop:10},onClick:sendWeeklyReportEmail},saving?"Sending…":"✉️ Send Weekly Report"),
      e("p",{style:{textAlign:"center",fontSize:11,color:"#aaa",marginTop:10}},"Open in browser → Print → Save as PDF")
    ),

    e(Modal,{show:modal==="users",onClose:closeModal,title:"Team Access"},
      data.users.filter(u=>u.role!=="removed").map(u=>e("div",{key:u.id,style:{display:"flex",alignItems:"center",gap:12,padding:"12px 0",borderBottom:"1px solid #F5F2EE"}},
        e(Avatar,{name:u.name,size:36}),
        e("div",{style:{flex:1}},e("p",{style:{margin:0,fontWeight:700,fontSize:14}},u.name),e("p",{style:{margin:"2px 0 0",fontSize:11,color:"#888"}},u.email)),
        e(Badge,{label:u.role,color:u.role==="Owner"?"#D97941":"#4A8FA4"}),
        u.role!=="Owner"&&e("button",{onClick:()=>removeUser(u.id),style:{background:"none",border:"none",color:"#CCC",fontSize:16,padding:"0 4px"}},"✕")
      )),
      e("div",{style:{marginTop:16}},e(Btn,{onClick:()=>setModal("addUser")},"+ Add Team Member"))
    ),

    e(Modal,{show:modal==="addUser",onClose:()=>setModal("users"),title:"Add Team Member"},
      e(Field,{label:"Full Name"},e(Inp,{placeholder:"Name",value:form.name||"",onChange:ev=>sf("name",ev.target.value)})),
      e(Field,{label:"Email (Google account)"},e(Inp,{type:"email",placeholder:"email@gmail.com",value:form.email||"",onChange:ev=>sf("email",ev.target.value)})),
      e(Field,{label:"Role"},e(Sel,{value:form.role||"Manager",onChange:ev=>sf("role",ev.target.value)},e("option",{value:"Manager"},"Manager"),e("option",{value:"Owner"},"Owner"))),
      e(Btn,{onClick:addUser,disabled:saving||!form.name?.trim()||!form.email?.trim()},saving?"Saving…":"Add Member")
    )
  );
}

// Load React then mount
const s1=document.createElement("script");
s1.src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js";
s1.async=false;
s1.onload=()=>{
  const s2=document.createElement("script");
  s2.src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js";
  s2.async=false;
  s2.onload=()=>{
    e = React.createElement;
    ({useState,useRef,useEffect,useCallback} = React);
    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  };
  document.head.appendChild(s2);
};
document.head.appendChild(s1);
</script>
</body>
</html>
